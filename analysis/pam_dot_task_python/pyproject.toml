[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pam-dot-task-python"
version = "0.1.0"
description = "Auditable Python parity port of the PAM/TAPAS dot-task analysis"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "pandas>=2.3,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

